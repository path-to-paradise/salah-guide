<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072e23" />
      <stop offset="55%" stop-color="#0b4434" />
      <stop offset="100%" stop-color="#116149" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#c8a24b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c8a24b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <rect width="512" height="512" fill="url(#glow)" />

  <g fill="#c8a24b">
    <!-- base wall -->
    <rect x="146" y="350" width="220" height="90" rx="4" />
    <!-- plinth -->
    <rect x="126" y="432" width="260" height="14" rx="3" />

    <!-- central dome drum -->
    <rect x="226" y="300" width="60" height="55" />
    <!-- central onion dome -->
    <path d="M196,300 C196,230 216,180 256,170 C296,180 316,230 316,300 Z" />
    <!-- dome neck -->
    <rect x="250" y="145" width="12" height="25" />

    <!-- left minaret -->
    <rect x="110" y="260" width="20" height="140" />
    <path d="M105,260 C105,245 110,235 120,235 C130,235 135,245 135,260 Z" />
    <circle cx="120" cy="225" r="5" />
    <rect x="118" y="203" width="4" height="22" />

    <!-- right minaret -->
    <rect x="382" y="260" width="20" height="140" />
    <path d="M377,260 C377,245 382,235 392,235 C402,235 407,245 407,260 Z" />
    <circle cx="392" cy="225" r="5" />
    <rect x="390" y="203" width="4" height="22" />
  </g>

  <!-- door arch (cut into the base) -->
  <path d="M236,440 L236,402 A20,20 0 0 1 276,402 L276,440 Z" fill="url(#bg)" />

  <!-- crescent on top of the central dome -->
  <circle cx="256" cy="128" r="15" fill="#c8a24b" />
  <circle cx="262" cy="123" r="12" fill="url(#bg)" />
</svg>
